[project]
name = "x4modkit"
version = "0.1.0"
description = "Shared release, publication and game-link tasks for X4: Foundations mod repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["markdown-it-py==4.0.0"]

[project.scripts]
x4mod = "x4modkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x4modkit"]
